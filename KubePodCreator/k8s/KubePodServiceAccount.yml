apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-api-service-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-creator-role
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "create","list", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-creator-binding
subjects:
- kind: ServiceAccount
  name: pod-api-service-account
  namespace: default
roleRef:
  kind: Role
  name: pod-creator-role
  apiGroup: rbac.authorization.k8s.io

